name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Make gradlew executable and fix line endings
        run: |
          sudo apt-get install -y dos2unix
          dos2unix android/gradlew
          chmod +x android/gradlew

      - name: Copy Web Assets to Android
        run: npx cap copy android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK to transfer.sh
        run: |
          echo "Uploading APK..."
          URL=$(curl -H "Max-Days: 7" --upload-file android/app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/Sovereign-AI.apk)
          echo "DOWNLOAD_URL=$URL" >> $GITHUB_ENV
          echo "Direct download link: $URL"

      - name: Commit Link to branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build-artifacts
          echo "${{ env.DOWNLOAD_URL }}" > download_link.txt
          git add download_link.txt
          git commit -m "Add download link"
          git push origin build-artifacts --force
