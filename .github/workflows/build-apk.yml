name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK to transfer.sh
        run: |
          echo "Uploading APK..."
          URL=$(curl -H "Max-Days: 7" --upload-file android/app/build/outputs/apk/debug/app-debug.apk https://transfer.sh/Sovereign-AI.apk)
          echo "DOWNLOAD_URL=$URL" >> $GITHUB_ENV
          echo "Direct download link: $URL"

      - name: Output Download Link
        run: |
          echo "========================================="
          echo "APK successfully built!"
          echo "Download here: ${{ env.DOWNLOAD_URL }}"
          echo "========================================="
